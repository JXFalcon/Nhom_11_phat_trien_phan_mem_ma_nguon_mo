name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP 8.2 – Lint & Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
          coverage: none

      - name: Kiểm tra cú pháp toàn bộ file PHP
        shell: bash
        run: |
          set -euo pipefail
          has_error=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              has_error=1
            fi
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "$has_error" -ne 0 ]; then
            echo "Phát hiện lỗi cú pháp PHP." >&2
            exit 1
          fi

      - name: Smoke check router.php và trang chủ
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8000 router.php > /tmp/orderflow-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS -o /tmp/orderflow-home.html http://127.0.0.1:8000/; then
              ok=1
              break
            fi
            sleep 0.5
          done

          if [ "$ok" -ne 1 ]; then
            echo "Không truy cập được trang chủ qua router.php." >&2
            cat /tmp/orderflow-server.log >&2 || true
            exit 1
          fi

          grep -q "OrderFlow" /tmp/orderflow-home.html
          echo "Smoke check trang chủ thành công."
